apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL Transitea
    uid: postgres-transitea
    type: postgres
    access: proxy
    url: $DB_HOST:$DB_PORT
    database: $DB_NAME
    user: $DB_USERNAME
    secureJsonData:
      password: $DB_PASSWORD
    jsonData:
      sslmode: disable
      postgresVersion: 1500
    editable: false
